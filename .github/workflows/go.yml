name: Go checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./tests)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -count=1 ./...
      - name: Race test (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build gateway
        run: go build ./cmd/dock-gateway
